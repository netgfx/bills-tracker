# Builds the Windows and macOS apps and publishes a GitHub release when a version tag is pushed.
# Run it by hand (Actions > Release > Run workflow) to build both without publishing; the installers
# are then attached to the run as artifacts.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  # First, so a mismatched tag or missing notes fails before the long builds.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read release notes
        if: github.event_name == 'push'
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"

  build-win:
    needs: notes
    runs-on: windows-latest
    # SignPath signing can wait for a person to approve the request.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # SignPath reads the unsigned artifact through the job's token
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:win

      # Code signing through SignPath Foundation (docs/code-signing.md). Skipped until the project is set up.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: release/Bills-Tracker-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      # Signing changes the file, so latest.yml's checksum and the blockmap must be redone or updates fail.
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Filter 'Bills-Tracker-Setup-*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'SignPath returned no installer' }
          if ((Get-AuthenticodeSignature $exe.FullName).Status -ne 'Valid') { throw 'The returned installer is not validly signed' }
          Copy-Item $exe.FullName "release/$($exe.Name)" -Force
          node scripts/finalize-signed-installer.mjs "release/$($exe.Name)" release/latest.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            release/Bills-Tracker-Setup-*.exe
            release/Bills-Tracker-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  build-mac:
    needs: notes
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Developer ID signing and notarization (docs/code-signing.md). Without them the app is ad-hoc signed.
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build the app
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run dist:mac -- -c.mac.identity=-
          else
            npm run dist:mac
          fi
      - name: Check the bundled Claude CLI is in the app and runs
        run: |
          cli="release/mac-arm64/Bills Tracker.app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          test -x "$cli"
          "$cli" --version
          codesign --verify --deep --strict "release/mac-arm64/Bills Tracker.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: |
            release/Bills-Tracker-*-arm64.dmg
            release/Bills-Tracker-*-arm64.dmg.blockmap
            release/Bills-Tracker-*-arm64.zip
            release/Bills-Tracker-*-arm64.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [build-win, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      # By name: the unsigned-installer artifact has the same file name as the signed one and must not be published.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac
          path: dist
      # latest.yml and latest-mac.yml (with the blockmaps) are what installed apps read to update themselves.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Bills Tracker ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
