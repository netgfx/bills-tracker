appId: com.djmid.billstracker
productName: Bills Tracker
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.{md,map}'
  - '!src/**'
# claude.exe (bundled with the Agent SDK) must live outside the asar to be spawnable.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**
  - resources/**
extraResources:
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bills Tracker
  runAfterFinish: true
  # No spaces: GitHub rewrites them in asset names, which would break the URLs in latest.yml.
  artifactName: Bills-Tracker-Setup-${version}.${ext}
npmRebuild: false
# The auto-update feed. .github/workflows/release.yml uploads the files; `npm run dist` never publishes.
publish:
  provider: github
  owner: netgfx
  repo: bills-tracker
